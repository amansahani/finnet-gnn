name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m pip install ruff && python -m ruff check src tests
      - name: Validate default lab config
        run: python -m finnet validate --config configs/default.yaml
      - name: Test
        run: pytest -q
      - name: Docker build
        run: docker build -t finnet-gnn:ci .
