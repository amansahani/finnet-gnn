[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finnet-gnn"
version = "0.1.0"
description = "Autonomous financial network gateway with real-time dynamic GNN fraud mitigation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aman Sahani" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "PyYAML>=6.0",
  "uvloop>=0.19; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
kaggle = ["kaggle>=1.6"]

[project.scripts]
finnet = "finnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finnet = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
